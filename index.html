<title>Flipbook PUP Remaja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: satu halaman buku per layar; ilustrasi bertema di kiri/atas, materi interaktif di kanan/bawah. Efek balik halaman 3D. */
:root{
  --bg:#E4F1F7; --paper:#FFFFFF; --ink:#0B2545; --ink2:#46627C; --line:#D2E2EB;
  --navy:#0B2545; --teal:#0FB5A0; --teal-d:#08806F; --sun:#FFC93C; --coral:#F2594A; --sky:#BFE6F2;
  --panel1:#D9F3F1; --panel2:#BCE0F2; --soft:#F1F8FB; --ok:#12A150; --bad:#E5484D;
  --fd:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --fb:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 18px 50px rgba(11,37,69,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06111F; --paper:#0E2140; --ink:#E9F3F9; --ink2:#9DB7CB; --line:#20405F; --soft:#12294A;
  --panel1:#0C3A4A; --panel2:#0E2D55; --sky:#1E5A7E; --navy:#E9F3F9; --teal-d:#4FE0CB; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06111F; --paper:#0E2140; --ink:#E9F3F9; --ink2:#9DB7CB; --line:#20405F; --soft:#12294A;
  --panel1:#0C3A4A; --panel2:#0E2D55; --sky:#1E5A7E; --navy:#E9F3F9; --teal-d:#4FE0CB; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-direction:column;gap:10px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;max-width:1120px;width:100%;margin-inline:auto}
.top .brand{font-family:var(--fd);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand b{color:var(--teal-d)}
.ib{width:42px;height:42px;border-radius:14px;background:var(--paper);box-shadow:0 2px 0 var(--line);display:grid;place-items:center;font-size:1.15rem;flex:none;transition:transform .15s}
.ib:hover{transform:translateY(-2px)} .ib:active{transform:translateY(1px)}
.ib[aria-pressed="true"]{background:var(--teal);color:#fff}
.prog{max-width:1120px;width:100%;margin-inline:auto;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--sun));border-radius:9px;transition:width .5s}
.stage{flex:1;min-height:0;max-width:1120px;width:100%;margin-inline:auto;perspective:2200px;position:relative}
.page{position:absolute;inset:0;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);transform-origin:left center;backface-visibility:hidden}
.page.out{animation:flipOut .62s cubic-bezier(.5,.1,.3,1) forwards;z-index:5}
.page.in{animation:flipIn .62s cubic-bezier(.5,.1,.3,1) both;z-index:5}
.page.under{z-index:1}
@keyframes flipOut{0%{transform:rotateY(0);filter:brightness(1)}100%{transform:rotateY(-105deg);filter:brightness(.7)}}
@keyframes flipIn{0%{transform:rotateY(-105deg);filter:brightness(.7)}100%{transform:rotateY(0);filter:brightness(1)}}
.ill{position:relative;background:linear-gradient(160deg,var(--panel1),var(--panel2));display:grid;place-items:center;overflow:hidden;min-height:0}
.ill svg{width:100%;height:100%;max-height:100%;display:block}
.ill .pno{position:absolute;left:14px;bottom:10px;font-family:var(--fd);font-weight:800;font-size:3.4rem;line-height:1;color:var(--ink);opacity:.1;pointer-events:none}
.txt{padding:26px 30px 30px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.kick{align-self:flex-start;font-weight:800;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;background:var(--navy);color:var(--paper);padding:5px 12px;border-radius:99px}
h2{font-family:var(--fd);font-weight:800;font-size:clamp(1.45rem,2.6vw,2.05rem);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2 em{font-style:normal;color:var(--teal-d)}
p{margin:0}
.lead{color:var(--ink2);font-size:1.02rem}
.hint{font-size:.82rem;font-weight:800;color:var(--teal-d);display:flex;align-items:center;gap:6px}
.hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.4s infinite}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1120px;width:100%;margin-inline:auto}
.nb{display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:16px;font-weight:800;background:var(--navy);color:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .15s}
.nb:hover{transform:translateY(-2px)} .nb:active{transform:translateY(2px);box-shadow:none}
.nb.alt{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.nb[disabled]{opacity:.35;pointer-events:none}
.ind{font-size:.85rem;font-weight:800;color:var(--ink2);text-align:center;min-width:0}
.ind b{color:var(--ink)}
/* komponen */
.card{background:var(--soft);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:12px 14px;transition:.18s}
.opt:hover{border-color:var(--teal);transform:translateX(3px)}
.opt .n{flex:none;width:34px;height:34px;border-radius:11px;background:var(--navy);color:var(--paper);font-weight:800;display:grid;place-items:center;font-size:1rem}
.opt .t{font-weight:800;line-height:1.25}
.opt .d{display:none;color:var(--ink2);font-size:.93rem;margin-top:5px}
.opt.open{border-color:var(--teal);background:var(--paper);box-shadow:0 6px 18px rgba(15,181,160,.18)}
.opt.open .d{display:block;animation:rise .3s}
.opt.open .n{background:var(--teal);color:#fff}
.opt.seen .n{background:var(--teal-d);color:var(--paper)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:99px;border:2px solid var(--line);font-weight:800;font-size:.9rem;background:var(--paper)}
.tab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.callout{border-radius:18px;padding:14px 16px;background:linear-gradient(135deg,var(--navy),#16487a);color:#fff;font-weight:700}
:root[data-theme="dark"] .callout{background:linear-gradient(135deg,#12467a,#0c6d78)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .callout{background:linear-gradient(135deg,#12467a,#0c6d78)}}
.callout.warn{background:linear-gradient(135deg,#C2412F,#F2594A)}
.big{font-family:var(--fd);font-weight:800;font-size:2.3rem;line-height:1;color:var(--teal-d)}
.stat{display:flex;gap:14px;align-items:center}
.bar{height:16px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--teal);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar i.c{background:var(--coral)} .bar i.s{background:var(--sun)}
.ref{font-size:.92rem;border-left:5px solid var(--teal);padding:4px 0 4px 12px;color:var(--ink2)}
.ref b{color:var(--ink)}
.sbtn{padding:10px 18px;border-radius:14px;font-weight:800;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d)}
.sbtn:active{transform:translateY(3px);box-shadow:none}
.flip{perspective:900px;height:auto}
.fc{position:relative;width:100%;min-height:150px;transform-style:preserve-3d;transition:transform .6s;text-align:left;display:block}
.fc.f{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.fc .a{background:linear-gradient(135deg,#C2412F,#F2594A);color:#fff}
.fc .b{background:linear-gradient(135deg,#0a7d6d,#0FB5A0);color:#fff;transform:rotateY(180deg)}
.fc small{font-weight:800;letter-spacing:.1em;font-size:.72rem;opacity:.9}
.fc span{font-weight:700;font-size:.95rem;line-height:1.35}
.qopt{width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);background:var(--soft);border-radius:14px;font-weight:700;display:flex;gap:10px;transition:.15s}
.qopt:hover{border-color:var(--teal)}
.qopt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qopt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.qopt[disabled]{cursor:default}
textarea{width:100%;min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}
.toggle{display:flex;gap:6px}
.toggle button{flex:1;padding:7px;border-radius:11px;border:2px solid var(--line);font-weight:800;background:var(--paper);font-size:.88rem}
.toggle button.y{background:var(--ok);border-color:var(--ok);color:#fff}
.toggle button.n{background:var(--coral);border-color:var(--coral);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:var(--paper);padding:10px 18px;border-radius:99px;font-weight:800;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:30}
.toast.on{opacity:1}
/* animasi ilustrasi */
.fl{animation:float 4s ease-in-out infinite}.fl2{animation:float 5s ease-in-out -1.5s infinite}
.sw{animation:sway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sp{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.sp2{animation:spin 6s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.pu{animation:pulse2 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:twinkle 2.2s ease-in-out infinite}
.dr{animation:drop 1.6s linear infinite}
.pop{animation:popin .7s cubic-bezier(.3,1.6,.5,1) both}
.dash{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.2s .2s ease forwards}
.tick{animation:ticking 6s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
.walk{animation:walk 6s ease-in-out infinite alternate}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes sway{50%{transform:rotate(5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.6);opacity:.4}}
@keyframes pulse2{50%{transform:scale(1.12)}}
@keyframes twinkle{50%{opacity:.2}}
@keyframes drop{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(40px);opacity:0}}
@keyframes popin{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ticking{to{transform:rotate(360deg)}}
@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(150px)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
@media (max-width:820px){
  body{padding-block:8px;gap:8px}
  .page{grid-template-columns:1fr;grid-template-rows:auto;display:block;overflow-y:auto}
  .ill{height:clamp(160px,28dvh,240px)}
  .txt{overflow:visible;padding:20px 18px 28px}
  .ill .pno{font-size:2.4rem}
  .g2{grid-template-columns:1fr}
  .ind span{display:none}
  .nb{padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<style>.opt .t{display:block}.opt>span:last-child{min-width:0}.txt h3{font-size:1.05rem}svg text{font-family:var(--fd);font-weight:800}.hs{cursor:pointer}.hs:focus-visible{outline:none}.hs:focus-visible circle:nth-child(2){stroke:#0B2545;stroke-width:3}.fc span{display:block}</style>
<style>
.br{animation:breathe 3.2s ease-in-out infinite}
.bl{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.wv{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}
.pt{animation:ponytail 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 10%}
.cl{animation:drift 14s ease-in-out infinite alternate}.cl2{animation:drift 18s ease-in-out -6s infinite alternate}
@keyframes breathe{50%{transform:translateY(-2.2px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes wave{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes ponytail{50%{transform:rotate(9deg)}}
@keyframes drift{to{transform:translateX(34px)}}
.page.cv .ill{background:#0B2545}.page.cv .ill .pno{color:#fff;opacity:.14}
.page.cv h2{font-size:clamp(1.65rem,3.1vw,2.45rem)}
@media (max-width:820px){.page.cv .ill{height:clamp(300px,46dvh,400px)}}
</style>
<style>.stk{animation:stkbob 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;filter:drop-shadow(0 6px 7px rgba(11,37,69,.3))}
@keyframes stkbob{0%,100%{transform:translateY(0) rotate(-.9deg)}50%{transform:translateY(-6px) rotate(.9deg)}}</style>
<div id="app" style="display:contents">
<header class="top">
  <button class="ib" id="home" aria-label="Daftar isi" title="Daftar isi">🏠</button>
  <div class="brand">Flipbook <b>PUP</b> · Remaja Cerdas</div>
  <button class="ib" id="spk" aria-label="Bacakan halaman" aria-pressed="false" title="Narasi suara">🔊</button>
</header>
<div class="prog"><i id="pbar"></i></div>
<main class="stage" id="book"></main>
<nav class="ctrl">
  <button class="nb alt" id="prev">◄ <span>Kembali</span></button>
  <div class="ind" id="ind"></div>
  <button class="nb" id="next"><span>Lanjut</span> ►</button>
</nav>
<div class="toast" id="toast" role="status"></div>
</div><script>
/* ===== ILUSTRASI SVG PER HALAMAN ===== */
const stu=(x,y,s=1,o={})=>{
  const sk=o.skin||'#F2B28C',skd=o.skd||'#E39A74',hr=o.hair||'#2B1B12',sh=o.shirt||'#FFFFFF',pant=o.pant||'#7C8896',tie=o.tie||'#E5484D';
  const arm=(side,a,wv)=>`<g transform="translate(${side*29} 10) rotate(${a})"><g ${wv?'class="wv"':''}><rect x="-6.5" y="0" width="13" height="22" rx="6.5" fill="${sh}" stroke="#0B2545" stroke-opacity=".15"/><rect x="-5" y="18" width="10" height="26" rx="5" fill="${sk}"/><circle cy="46" r="6.5" fill="${sk}"/></g></g>`;
  const eyes=`<g class="bl"><ellipse cx="-8" cy="-26" rx="3.6" ry="4" fill="#fff"/><ellipse cx="8" cy="-26" rx="3.6" ry="4" fill="#fff"/><circle cx="-7.6" cy="-25.6" r="2.3" fill="#2a1a12"/><circle cx="8.4" cy="-25.6" r="2.3" fill="#2a1a12"/><circle cx="-6.8" cy="-26.6" r=".9" fill="#fff"/><circle cx="9.2" cy="-26.6" r=".9" fill="#fff"/></g>`;
  const face=`${eyes}<path d="M-12.5 -33.5 Q-8 -36 -4 -34 M4 -34 Q8 -36 12.5 -33.5" stroke="#2B1B12" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M0 -21 q2.4 3.4 -1 4.4" stroke="${skd}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`+(o.sad?`<path d="M-5 -9.5 Q0 -15 5 -9.5" stroke="#7A2E2E" stroke-width="2.4" fill="none" stroke-linecap="round"/>`:`<path d="M-6.5 -15 Q0 -6 6.5 -15z" fill="#8B2E2E"/><path d="M-4.4 -14.4 H4.4" stroke="#fff" stroke-width="1.6"/><circle cx="-14" cy="-17" r="3.8" fill="#FF8A80" opacity=".5"/><circle cx="14" cy="-17" r="3.8" fill="#FF8A80" opacity=".5"/>`);
  const ear=`<circle cx="-22" cy="-26" r="4.5" fill="${sk}"/><circle cx="22" cy="-26" r="4.5" fill="${sk}"/>`;
  let head,back='';
  if(o.hijab){head=`<path d="M-29 -24 Q-29 -60 0 -60 Q29 -60 29 -24 L29 6 Q0 24 -29 6z" fill="${o.hijab}"/><ellipse cx="0" cy="-26" rx="17.5" ry="20.5" fill="${sk}"/><path d="M-29 6 Q0 24 29 6 L23 -6 Q0 9 -23 -6z" fill="${o.hijab}"/><path d="M-22 -42 Q-8 -55 10 -52" stroke="#fff" stroke-opacity=".32" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="19" cy="-6" r="2.6" fill="#FFC93C"/>${face}`}
  else if(o.girl){back=`<path d="M-27 -30 C-31 -62 31 -62 27 -30 L29 2 Q0 12 -29 2z" fill="${hr}"/>`;head=`<g class="pt"><path d="M20 -50 Q52 -48 44 -4 Q40 -28 18 -40z" fill="${hr}"/><circle cx="21" cy="-46" r="4" fill="#F2594A"/></g>${ear}<circle cx="0" cy="-26" r="22" fill="${sk}"/><path d="M-23 -28 C-24 -54 24 -54 23 -28 C16 -42 4 -44 -6 -38 C-12 -35 -18 -33 -23 -28z" fill="${hr}"/>${face}`}
  else{head=`${ear}<circle cx="0" cy="-26" r="22" fill="${sk}"/><path d="M-23.5 -28 C-27 -56 27 -56 23.5 -28 C17 -38 7 -42 -3 -39 C-12 -36 -19 -33 -23.5 -28z" fill="${hr}"/>${face}`}
  const legs=o.hijab?`<path d="M-26 52 H26 L30 106 H-30z" fill="${pant}"/><path d="M0 60 V106" stroke="#0B2545" stroke-opacity=".12" stroke-width="2"/>`
    :o.girl?`<rect x="-17" y="86" width="12" height="20" fill="${sk}"/><rect x="5" y="86" width="12" height="20" fill="${sk}"/><rect x="-18" y="94" width="14" height="12" fill="#fff"/><rect x="4" y="94" width="14" height="12" fill="#fff"/><path d="M-30 52 H30 L37 92 H-37z" fill="${pant}"/><path d="M-12 60 L-15 92 M0 60 V92 M12 60 L15 92" stroke="#0B2545" stroke-opacity=".12" stroke-width="2"/>`
    :`<rect x="-23" y="50" width="19" height="56" rx="7" fill="${pant}"/><rect x="4" y="50" width="19" height="56" rx="7" fill="${pant}"/><rect x="-4" y="52" width="8" height="24" fill="${pant}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})">
  <ellipse cx="0" cy="112" rx="40" ry="6" fill="#0B2545" opacity=".2"/>
  ${legs}
  <ellipse cx="-12" cy="108" rx="13" ry="6" fill="#1b1b1b"/><ellipse cx="12" cy="108" rx="13" ry="6" fill="#1b1b1b"/>
  <g class="br">
  ${o.bag?`<rect x="-35" y="4" width="70" height="54" rx="15" fill="${o.bag}"/>`:''}
  ${back}
  <rect x="-6" y="-8" width="12" height="14" fill="${skd}"/>
  <rect x="-31" y="0" width="62" height="64" rx="18" fill="${sh}" stroke="#0B2545" stroke-opacity=".15"/>
  <path d="M15 8 Q31 12 30 50 Q24 58 19 56z" fill="#0B2545" opacity=".06"/>
  ${o.bag?`<rect x="-22" y="2" width="8" height="48" rx="4" fill="#0B2545" opacity=".25"/><rect x="14" y="2" width="8" height="48" rx="4" fill="#0B2545" opacity=".25"/>`:''}
  <path d="M-15 -2 L0 15 L-17 13z" fill="#fff" stroke="#0B2545" stroke-opacity=".18"/><path d="M15 -2 L0 15 L17 13z" fill="#fff" stroke="#0B2545" stroke-opacity=".18"/>
  <path d="M-4 13 L4 13 L6.5 38 L0 46 L-6.5 38z" fill="${tie}"/><path d="M-3.6 10 H3.6 L4.4 14 H-4.4z" fill="#0B2545" opacity=".25"/>
  <rect x="13" y="30" width="14" height="15" rx="3" fill="none" stroke="#0B2545" stroke-opacity=".22"/><circle cx="20" cy="36" r="3.3" fill="#0FB5A0"/>
  ${arm(-1,o.aL??8,o.waveL)}${arm(1,o.aR??-8,o.wave)}
  ${head}
  </g></g>`;};
const star=(x,y,r=6,d=0)=>`<path class="tw" style="animation-delay:${d}s" transform="translate(${x} ${y})" d="M0 ${-r} L${r*.3} ${-r*.3} L${r} 0 L${r*.3} ${r*.3} L0 ${r} L${-r*.3} ${r*.3} L${-r} 0 L${-r*.3} ${-r*.3}z" fill="#FFC93C"/>`;

const MOD=['Cover','Pendahuluan','Navigasi','Modul 1 · Orientasi PUP','Modul 1 · Orientasi PUP','Modul 1 · Orientasi PUP','Modul 1 · Orientasi PUP','Modul 1 · Orientasi PUP','Modul 2 · Bahaya Pernikahan Dini','Modul 2 · Bahaya Pernikahan Dini','Modul 2 · Bahaya Pernikahan Dini','Modul 2 · Bahaya Pernikahan Dini','Modul 2 · Bahaya Pernikahan Dini','Modul 2 · Bahaya Pernikahan Dini','Modul 3 · Meluruskan Miskonsepsi','Modul 3 · Evaluasi Diri','Modul 4 · Solusi & Tindakan','Modul 4 · Studi Kasus','Modul 4 · Evaluasi Pengetahuan','Penutup · Ringkasan','Penutup · Referensi'];
const $=(r,s)=>r.querySelector(s),$$=(r,s)=>[...r.querySelectorAll(s)];
const ACC=(items,cls='')=>`<div class="grid acc ${cls}">${items.map((x,i)=>`<button class="opt" aria-expanded="false"><span class="n">${i+1}</span><span><span class="t">${x[0]}</span><span class="d">${x[1]}</span></span></button>`).join('')}</div>`;
function accInit(root,cb){const bs=$$(root,'.acc .opt');bs.forEach((b,i)=>b.addEventListener('click',()=>{const was=b.classList.contains('open');bs.forEach(x=>{x.classList.remove('open');x.setAttribute('aria-expanded','false')});if(!was){b.classList.add('open');b.setAttribute('aria-expanded','true');b.classList.add('seen')}cb&&cb(i,!was,bs.filter(x=>x.classList.contains('seen')).length,bs.length)}))}
const toast=(m)=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)};
const confetti=()=>{const c=['#FFC93C','#0FB5A0','#F2594A','#4FA3F7','#fff'];for(let i=0;i<46;i++){const d=document.createElement('i');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=c[i%5];d.style.animationDelay=Math.random()*.6+'s';d.style.animationDuration=1.8+Math.random()*1.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}};
const P={};

P[2]={t:'Halo, Teman-Teman <em>Remaja!</em>',
b:()=>`<p class="lead">Selamat datang di Flipbook Edukasi Pendewasaan Usia Perkawinan (PUP)! Masa remaja adalah masa emas yang penuh dengan potensi, impian, dan kesempatan untuk mengeksplorasi cita-cita. Memahami kesehatan reproduksi dan perencanaan masa depan bukanlah hal yang tabu, melainkan bekal penting agar kamu dapat mengambil keputusan hidup yang cerdas dan bertanggung jawab.</p>
<p class="lead">Flipbook interaktif ini dirancang khusus untuk kamu agar dapat belajar secara mandiri, seru, dan menyenangkan. Mari persiapkan diri menjadi <b style="color:var(--ink)">generasi emas</b> yang sehat, cerdas, dan siap menyongsong masa depan cerah!</p>
<h3 style="font-family:var(--fd);margin:6px 0 0">Petunjuk Penggunaan</h3><p class="hint">Ketuk tiap petunjuk</p>
${ACC([['Navigasi Halaman','Klik tanda panah (◄ / ►) atau geser layar (swipe) untuk berpindah halaman.'],['Audio & Video','Klik ikon speaker 🔊 di pojok atas untuk mendengarkan narasi suara halaman ini.'],['Fitur Interaktif','Ketuk kartu, titik yang berdenyut, dan tombol untuk membuka info tambahan.'],['Kuis & Checklist','Isi lembar checklist mandiri dan kuis interaktif untuk menguji pemahamanmu.'],['Menu Utama','Klik tombol Rumah 🏠 di pojok atas untuk kembali ke Daftar Isi kapan saja.']])}`,
i:r=>accInit(r)};

P[4]={t:'Tujuan &amp; Manfaat <em>Edukasi PUP</em>',
b:()=>`<p class="lead">Setelah mempelajari flipbook ini, kamu diharapkan mampu:</p>
${ACC([['Memahami konsep dasar PUP','Memahami konsep dasar Pendewasaan Usia Perkawinan (PUP) dan rekomendasi usia ideal menikah menurut BKKBN (2025).'],['Membedakan batas hukum dan usia ideal','Membedakan batas usia minimal hukum dan usia ideal kematangan reproduksi.'],['Mengenali 4 dimensi kesiapan','Mengidentifikasi 4 dimensi kesiapan berkeluarga (fisik, mental, ekonomi, dan sosial).'],['Menganalisis risiko pernikahan dini','Menganalisis berbagai risiko dan dampak negatif pernikahan dini bagi kesehatan, psikologis, dan masa depan.'],['Mengambil keputusan terencana','Mengambil keputusan terencana untuk menunda pernikahan hingga mencapai usia matang.']])}
<h3 style="font-family:var(--fd);margin:6px 0 0">Manfaat untuk Remaja</h3>
<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true">Diri Sendiri</button><button class="tab" role="tab" aria-selected="false">Kesehatan Reproduksi</button><button class="tab" role="tab" aria-selected="false">Keluarga Masa Depan</button></div>
<div class="callout" id="mf">Memiliki panduan hidup yang jelas untuk mengejar pendidikan dan karier cita-cita tanpa terhambat pernikahan prematur.</div>`,
i:r=>{accInit(r);const M=['Memiliki panduan hidup yang jelas untuk mengejar pendidikan dan karier cita-cita tanpa terhambat pernikahan prematur.','Melindungi organ reproduksi dari risiko komplikasi kehamilan dini dan kanker serviks.','Memastikan mampu melahirkan keturunan yang sehat, bebas stunting, dan tumbuh dalam keluarga yang harmonis serta mandiri secara finansial.'];const ts=$$(r,'.tab');ts.forEach((t,i)=>t.addEventListener('click',()=>{ts.forEach(x=>x.setAttribute('aria-selected',x===t));const m=$(r,'#mf');m.textContent=M[i];m.style.animation='none';m.offsetHeight;m.style.animation='rise .3s'}))}};

P[5]={t:'Apa Itu <em>PUP</em>?',
b:()=>`<div class="callout">Pendewasaan Usia Perkawinan (PUP) adalah upaya meningkatkan usia pertama menikah hingga minimal <u>21 tahun untuk perempuan</u> dan <u>25 tahun untuk laki-laki</u>.</div>
<p class="lead">PUP bukan sekadar menunda pernikahan, melainkan mengusahakan agar pernikahan dilakukan pada usia yang benar-benar matang dari segi fisik, psikologis, finansial, dan sosial. <span style="font-size:.85rem">(BKKBN, 2025)</span></p>
<div class="card"><label for="age" style="font-weight:800">Geser usia untuk melihat tahap hidupmu: <span id="av" style="color:var(--teal-d);font-size:1.3rem">17</span> tahun</label>
<input id="age" type="range" min="15" max="30" value="17" style="width:100%;accent-color:var(--teal);margin-top:8px"><p id="as" style="margin-top:6px;font-weight:700"></p></div>
<p class="hint">Marker di ilustrasi ikut bergerak</p>
${ACC([['Masa Menunda Perkawinan (usia < 21 tahun)','Fokus utama remaja adalah menyelesaikan pendidikan, mengasah potensi diri, menjaga kesehatan reproduksi, dan membangun cita-cita.'],['Masa Menata Perkawinan (usia 21–25 tahun)','Memasuki usia kematangan fisik dan emosional, menata kesiapan karier/ekonomi, serta mempersiapkan mental rumah tangga.'],['Masa Menjarangkan Kehamilan (usia > 25 tahun)','Mengatur jarak kelahiran anak secara sehat menggunakan alat kontrasepsi yang tepat.']])}`,
i:r=>{accInit(r);const S=['Kamu di masa MENUNDA: fokus sekolah, potensi diri, dan kesehatan reproduksi.','Kamu di masa MENATA: matangkan karier/ekonomi dan mental rumah tangga.','Kamu di masa MENJARANGKAN: atur jarak kelahiran secara sehat.'];const a=$(r,'#age');const f=()=>{const v=+a.value;$(r,'#av').textContent=v;const k=v<21?0:v<=25?1:2;$(r,'#as').textContent=S[k];const x=v<21?30+(v-15)*19:v<=25?150+(v-21)*25:275+(v-26)*22;$(r,'#mk').style.transform=`translate(${x}px,0)`;$(r,'#mkt').textContent=v};a.addEventListener('input',f);f()}};

P[6]={t:'Usia Ideal <em>vs</em> Batas Hukum',
b:()=>`<p class="lead">Banyak remaja bingung antara <b style="color:var(--ink)">batas minimal hukum</b> dan <b style="color:var(--ink)">usia ideal kesehatan</b>. Ketuk untuk membandingkan:</p>
<div class="tabs"><button class="tab" aria-selected="true">UU No. 16 Tahun 2019</button><button class="tab" aria-selected="false">Rekomendasi BKKBN (2025)</button></div>
<div class="card" id="cmp" style="display:grid;gap:12px"></div>
<div class="callout"><b>Mengapa BKKBN menganjurkan usia lebih tinggi?</b><br><span style="font-weight:600;font-size:.95rem">Penelitian medis menunjukkan pada usia 19 tahun, panggul perempuan dan fungsi emosional remaja belum matang sempurna. Usia 21 tahun bagi perempuan memastikan tulang panggul mencapai diameter maksimal untuk persalinan aman, sedangkan usia 25 tahun bagi laki-laki memastikan kemandirian finansial dan kematangan otak bagian depan (<i>prefrontal cortex</i>) dalam mengendalikan emosi keluarga.</span></div>`,
i:r=>{const V=[{h:'Batas minimal perkawinan menurut hukum: pihak laki-laki dan perempuan sama-sama minimal 19 tahun. Ini batas legal terendah agar tidak dikategorikan pernikahan anak.',b:[['Laki-laki',19,''],['Perempuan',19,'']]},{h:'Rekomendasi usia ideal menurut BKKBN dan kesehatan reproduksi:',b:[['Laki-laki',25,'s'],['Perempuan',21,'']]}];const draw=k=>{const v=V[k];$(r,'#cmp').innerHTML=`<p style="font-size:.95rem">${v.h}</p>`+v.b.map(x=>`<div><div style="display:flex;justify-content:space-between;font-weight:800"><span>${x[0]}</span><span>Minimal ${x[1]} tahun</span></div><div class="bar"><i class="${x[2]}" data-w="${x[1]/25*100}"></i></div></div>`).join('');setTimeout(()=>$$(r,'#cmp .bar i').forEach(i=>i.style.width=i.dataset.w+'%'),60)};draw(0);const ts=$$(r,'.tab');ts.forEach((t,i)=>t.addEventListener('click',()=>{ts.forEach(x=>x.setAttribute('aria-selected',x===t));draw(i)}))}};

P[7]={t:'Empat Dimensi <em>Kesiapan</em> Berkeluarga',
b:()=>`<p class="lead">Sebelum memutuskan menikah, setiap individu perlu memenuhi 4 dimensi kesiapan (BKKBN, 2025). Buka satu per satu dan lihat lingkaran di ilustrasi terisi!</p>
${ACC([['Kesiapan Fisik & Biologis','Organ reproduksi telah berkembang matang sempurna. Pada perempuan, panggul telah mencapai ukuran dewasa (> 24 cm) dan bebas dari anemia (Hb > 12 g/dL) serta Kurang Energi Kronis (KEK).'],['Kesiapan Mental & Psikologis','Memiliki stabilitas emosi, mampu mengelola stres, tidak egois, serta memiliki keterampilan komunikasi dan penyelesaian konflik secara dewasa tanpa kekerasan.'],['Kesiapan Finansial & Ekonomi','Memiliki penghasilan atau pekerjaan yang stabil untuk memenuhi kebutuhan pokok rumah tangga (pangan, papan, kesehatan, dan pendidikan anak) secara mandiri.'],['Kesiapan Sosial & Peran Keluarga','Memahami hak dan kewajiban sebagai suami/istri, mampu bersosialisasi dengan masyarakat dan keluarga besar, serta menerapkan pola asuh anak yang setara.']])}
<p class="hint" id="pg">0 dari 4 dimensi sudah kamu buka</p>`,
i:r=>accInit(r,(i,o,n,t)=>{if(o){const q=$(r,'#q'+(i+1));q.style.opacity=1;q.style.transition='opacity .6s'}$(r,'#pg').textContent=n+' dari 4 dimensi sudah kamu buka';if(n===4){$(r,'#rd').textContent='SIAP!';toast('Keempat dimensi harus terpenuhi sekaligus!')}})};

P[8]={t:'Mengapa Usia Ideal Menikah <em>Sangat Penting?</em>',
b:()=>`<p class="lead">Alasan medis dan sosial pentingnya menunda nikah sampai matang:</p>
${ACC([['Menjamin Kematangan Organ Reproduksi','Mencegah bahaya robekan jalan lahir, pendarahan hebat, dan komplikasi kehamilan yang menjadi penyebab utama kematian ibu muda.'],['Menjamin Kesiapan Mental Menjadi Orang Tua','Merawat dan mendidik anak membutuhkan kesabaran tinggi. Kematangan emosi mencegah terjadinya pengabaian anak (child neglect) dan KDRT.'],['Memutus Lingkaran Kemiskinan','Menikah di usia ideal memberi kesempatan menyelesaikan pendidikan tinggi dan mendapatkan pekerjaan layak sebelum menanggung beban ekonomi keluarga.'],['Mencegah Stunting pada Generasi Penerus','Ibu yang hamil di usia matang dengan gizi tercukupi akan melahirkan bayi yang sehat dan terhindar dari risiko stunting (tengkes).']])}`,
i:r=>accInit(r)};

P[9]={t:'Apa Itu <em>Pernikahan Dini?</em>',
b:()=>`<div class="callout warn">Pernikahan dini (pernikahan usia anak) adalah ikatan perkawinan yang dilakukan oleh salah satu atau kedua pasangan yang masih berusia <u>di bawah 19 tahun</u>, atau belum mencapai kematangan fisik, psikologis, dan ekonomi yang adekuat.</div>
<div class="card"><b>Coba cek:</b> pilih usia saat menikah<div class="tabs" style="margin-top:8px" id="ages">${[16,17,18,19,21,25].map(a=>`<button class="tab" aria-selected="false">${a}</button>`).join('')}</div><p id="ar" style="margin-top:10px;font-weight:700">Pilih salah satu usia di atas.</p></div>
<h3 style="font-family:var(--fd);margin:4px 0 0">Realita &amp; Fakta di Indonesia</h3>
<p class="lead">Berdasarkan data BKKBN dan BPS, Indonesia masih berada pada jajaran angka pernikahan dini yang cukup tinggi di Asia Tenggara. Sebagian besar terjadi akibat Kehamilan yang Tidak Diinginkan (KTD), tekanan ekonomi keluarga, serta kurangnya literasi kesehatan reproduksi remaja.</p>
<div class="callout">Pernikahan dini bukanlah solusi atas masalah, melainkan awal dari berbagai permasalahan kesehatan dan sosial yang baru!</div>`,
i:r=>{const ts=$$(r,'#ages .tab');ts.forEach(t=>t.addEventListener('click',()=>{ts.forEach(x=>x.setAttribute('aria-selected',x===t));const a=+t.textContent;$(r,'#ar').innerHTML=a<19?'<span style="color:var(--coral)">Termasuk pernikahan dini / usia anak</span> (di bawah 19 tahun).':a<21?'Memenuhi batas hukum (19 tahun), tetapi masih di bawah usia ideal BKKBN untuk perempuan (21 tahun).':a<25?'Perempuan sudah memenuhi usia ideal (21). Laki-laki idealnya menunggu hingga 25 tahun.':'<span style="color:var(--teal-d)">Memenuhi usia ideal PUP</span> untuk perempuan (21) maupun laki-laki (25).'}))}};

P[10]={t:'Faktor-Faktor <em>Penyebab</em> Pernikahan Dini',
b:()=>`<p class="lead">Pernikahan dini dipicu interaksi berbagai faktor kompleks <span style="font-size:.85rem">(Hadiningrum, 2024)</span>. Ketuk tiap penyebab:</p>
${ACC([['Perilaku Seksual Berisiko & KTD','Kurangnya pemahaman kesehatan reproduksi menyebabkan Kehamilan Tidak Diinginkan (KTD), yang mengarah pada pernikahan terpaksa (forced marriage).'],['Faktor Ekonomi Keluarga','Anggapan keliru bahwa menikahkan anak perempuan akan mengurangi beban finansial orang tua dalam memenuhi kebutuhan harian.'],['Tingkat Pendidikan Rendah','Rendahnya cita-cita dan kurangnya akses informasi menyebabkan remaja tidak memiliki perencanaan masa depan yang jelas.'],['Faktor Budaya & Tradisi Lokal','Mitos ketakutan menjadi "perawan tua" jika tidak segera menikah setelah lulus sekolah menengah.'],['Perundungan & Pengaruh Teman Sebaya (Peer Pressure)','Ikut-ikutan teman yang menikah muda tanpa mempertimbangkan konsekuensi jangka panjang.']])}`,
i:r=>accInit(r)};
P[11]={t:'Dampak pada <em>Kesehatan Fisik</em> Ibu',
b:()=>`<p class="lead">Bahaya medis bila hamil di usia remaja <span style="font-size:.85rem">(Hadiningrum, 2024)</span>. Ketuk titik pada siluet atau pilih kartu di bawah:</p>
${ACC([['Anemia & Kurang Energi Kronis (KEK)','Tubuh remaja masih membutuhkan gizi untuk pertumbuhannya sendiri (growth spurt). Jika terjadi kehamilan, terjadi perebutan gizi antara ibu remaja dan janin, memicu anemia berat.'],['Preeklamsia & Eklamsia','Tekanan darah tinggi saat hamil yang sangat berisiko menyebabkan kejang dan kematian ibu hamil usia remaja.'],['Disproporsi Kepala Panggul (CPD / Panggul Sempit)','Tulang panggul perempuan baru mencapai bentuk dan ukuran dewasa sempurna pada usia 20–21 tahun. Panggul yang sempit menyebabkan persalinan macet (obstructed labor) dan pendarahan hebat.'],['Kanker Leher Rahim (Kanker Serviks)','Hubungan seksual di bawah usia 18 tahun meningkatkan risiko trauma organ reproduksi dan infeksi HPV yang memicu kanker serviks di kemudian hari.']])}`,
i:r=>{const bs=$$(r,'.acc .opt');accInit(r);$$(r,'.hs').forEach(h=>{h.addEventListener('click',()=>{const b=bs[+h.dataset.k];if(!b.classList.contains('open'))b.click();b.scrollIntoView({block:'nearest',behavior:'smooth'})});h.setAttribute('role','button');h.setAttribute('tabindex','0');h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();h.dispatchEvent(new Event('click'))}})})}};

P[12]={t:'Dampak pada <em>Janin &amp; Bayi</em>',
b:()=>`<p class="lead">Risiko kesehatan pada bayi yang dilahirkan:</p>
${ACC([['Bayi Berat Lahir Rendah (BBLR)','Bayi lahir dengan berat kurang dari 2.500 gram akibat suplai nutrisi dari ibu remaja yang tidak adekuat selama kehamilan.'],['Kelahiran Prematur','Bayi lahir sebelum usia kandungan mencapai 37 minggu, sehingga organ tubuh bayi belum siap berfungsi sempurna di luar kandungan.'],['Risiko Stunting (Tengkes)','Anak yang dilahirkan oleh ibu remaja berisiko 2 kali lebih tinggi mengalami stunting (gagal tumbuh dan gangguan perkembangan otak) akibat pola asuh dan gizi yang buruk.'],['Angka Kematian Bayi (AKB) Tinggi','Risiko kematian bayi pada ibu berusia di bawah 19 tahun mencapai 50% lebih tinggi dibandingkan ibu berusia 20–29 tahun.']])}
<div class="card" id="cmp" style="display:grid;gap:10px"><b>Bandingkan secara relatif</b>
<div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:.9rem"><span>Risiko kematian bayi, ibu 20–29 th</span><span>100</span></div><div class="bar"><i data-w="66"></i></div></div>
<div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:.9rem"><span>Ibu di bawah 19 th (50% lebih tinggi)</span><span>150</span></div><div class="bar"><i class="c" data-w="100"></i></div></div>
<div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:.9rem"><span>Risiko stunting, ibu usia matang</span><span>1×</span></div><div class="bar"><i data-w="50"></i></div></div>
<div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:.9rem"><span>Risiko stunting, ibu remaja</span><span>2×</span></div><div class="bar"><i class="c" data-w="100"></i></div></div></div>`,

P[13]={t:'Dampak <em>Psikis &amp; Mental</em>',
b:()=>`<p class="lead">Gangguan kesehatan mental yang bisa muncul <span style="font-size:.85rem">(Hadiningrum, 2024)</span>:</p>
${ACC([['Stres Berat & Depresi Pascalahir (Postpartum Depression)','Ketidaktahuan dan ketidaksiapan merawat bayi menimbulkan tekanan emosional luar biasa pada ibu remaja, memicu depresi hingga trauma mental.'],['Kehilangan Masa Remaja & Identitas Diri','Remaja terpaksa kehilangan kesempatan bermain, mengejar hobi, dan bersosialisasi dengan kawan sebaya karena terikat peran sebagai orang tua.'],['KDRT & Perceraian Dini','Emosi yang masih labil pada pasangan remaja menyebabkan tingginya frekuensi konflik, tindak KDRT fisik maupun verbal, hingga berujung pada perceraian di usia muda.']])}
<div class="callout">Butuh teman cerita? Bicaralah dengan orang tua, guru BK, atau Pusat Informasi dan Konseling Remaja (PIK-R) di sekolahmu.</div>`,
i:r=>accInit(r)};

P[14]={t:'Dampak <em>Sosial &amp; Ekonomi</em>',
b:()=>`<p class="lead">Kerugian sosial dan ekonomi jangka panjang:</p>
${ACC([['Putus Sekolah (Drop Out)','Sebagian besar remaja yang menikah dini, khususnya perempuan, terpaksa berhenti sekolah, sehingga kehilangan hak mendapatkan pendidikan dasar 12 tahun.'],['Terjebak Kemiskinan Antargenerasi','Tanpa ijazah dan keterampilan yang memadai, pasangan remaja sulit mendapatkan pekerjaan layak dengan penghasilan cukup, sehingga kemiskinan berlanjut ke anak cucu.'],['Isolasi Sosial & Stigma Masyarakat','Pasangan remaja sering merasa malu, terisolasi dari lingkungan pergaulan normal, dan mengalami tekanan stigma sosial dari lingkungan sekitar.']])}
<div class="callout warn">Pendidikan adalah kunci untuk memutus lingkaran kemiskinan.</div>`,
i:r=>accInit(r)};

P[15]={t:'<em>Mitos</em> vs <em>Fakta</em>',
b:()=>{const D=[['Menikah di usia muda bisa mengurangi beban ekonomi keluarga orang tua.','Menikah muda tanpa penghasilan tetap justru menambah beban ekonomi baru karena harus menanggung biaya hidup pasangan dan anak.'],['Daripada pacaran terus, lebih baik langsung dinikahkan saja walau masih sekolah.','Solusi pacaran sehat adalah edukasi batas perilaku, bukan menikah dini yang merusak masa depan pendidikan remaja.'],['Perempuan umur 18 tahun sudah siap hamil karena organ tubuhnya sudah lengkap.','Secara medis, panggul perempuan baru matang sempurna pada usia 21 tahun. Hamil < 20 tahun berisiko tinggi pendarahan dan stunting.'],['Bila sudah cinta sama cinta, masalah keuangan dan emosi nanti bisa diatur belakangan.','Sebagian besar perceraian usia muda disebabkan oleh konflik finansial dan ketidakmatangan emosi yang diabaikan di awal.']];
return `<p class="lead">Ketuk kartu untuk membongkar mitosnya!</p><div class="grid">${D.map((d,i)=>`<div class="flip"><button class="fc" style="min-height:${/** tinggi disesuaikan */ 150}px" aria-label="Mitos ${i+1}, ketuk untuk melihat fakta"><div class="a"><small>MITOS ${i+1}</small><span>“${d[0]}”</span></div><div class="b"><small>FAKTA ${i+1}</small><span>${d[1]}</span></div></button></div>`).join('')}</div><p class="hint" id="mc">0 dari 4 mitos terbongkar</p>`},
i:r=>{const cs=$$(r,'.fc');cs.forEach(c=>{c.style.minHeight='190px';c.addEventListener('click',()=>{c.classList.toggle('f');const n=cs.filter(x=>x.classList.contains('f')).length;$(r,'#mc').textContent=n+' dari 4 mitos terbongkar';if(n===4){confetti();toast('Semua mitos terbongkar!')}})})}};

P[16]={t:'Checklist Mandiri <em>Kesiapan Diri</em>',
b:()=>{const Q=['Kesiapan Pendidikan: sudah menyelesaikan pendidikan minimal SMA/K dan punya rencana kuliah/kerja?','Kesiapan Usia: usiamu sudah minimal 21 tahun (perempuan) atau 25 tahun (laki-laki)?','Kesiapan Fisik: bebas dari anemia dan memiliki kesehatan tubuh yang prima?','Kesiapan Mental: sudah mampu mengendalikan emosi marah dan menyelesaikan masalah tanpa emosi?','Kesiapan Finansial: sudah memiliki tabungan atau pekerjaan dengan penghasilan mandiri?'];
return `<p class="lead">Mari periksa sejauh mana kesiapan dirimu saat ini. Jawab jujur, jawabanmu tidak dikirim ke mana pun.</p><div class="grid">${Q.map((q,i)=>`<div class="card" data-q="${i}"><p style="font-weight:700;margin-bottom:8px">${i+1}. ${q}</p><div class="toggle"><button data-v="y">Ya</button><button data-v="n">Belum</button></div></div>`).join('')}</div>
<div class="card" id="res" style="display:none"></div>`},
i:r=>{const A={};const upd=()=>{const n=Object.keys(A).length,b=Object.values(A).filter(v=>v==='n').length,y=n-b,box=$(r,'#res');if(n<5){box.style.display='none';return}box.style.display='block';box.innerHTML=`<div class="stat"><span class="big">${y}/5</span><span style="font-weight:800">kesiapan sudah terpenuhi</span></div><div class="bar" style="margin:10px 0"><i style="width:${y*20}%"></i></div>`+(b>=3?`<div class="callout">Sebagian besar jawabanmu “Belum”. Itu artinya fokus utamamu saat ini adalah <u>Belajar, Mengejar Cita-Cita, dan Mengembangkan Potensi Diri!</u></div>`:`<div class="callout">Kamu sudah menyiapkan banyak hal. Tetap ingat: semua dimensi kesiapan perlu terpenuhi sebelum menikah.</div>`)};
$$(r,'[data-q]').forEach(c=>{const k=c.dataset.q,bs=$$(c,'button');bs.forEach(b=>b.addEventListener('click',()=>{A[k]=b.dataset.v;bs.forEach(x=>x.className=x===b?b.dataset.v:'');upd()}))})}};

P[17]={t:'Upaya &amp; Langkah <em>Pencegahan</em>',
b:()=>`<p class="lead">Strategi untuk remaja cerdas. Buka kelimanya untuk melengkapi perisaimu!</p>
${ACC([['Tingkatkan Literasi Kesehatan Reproduksi & PUP','Aktif mencari informasi dari sumber terpercaya seperti media flipbook ini, BKKBN, dan puskesmas.'],['Fokus Mengejar Pendidikan & Karier','Gantungkan cita-citamu setinggi langit. Pendidikan adalah investasi terbaik untuk masa depanmu dan keluargamu kelak.'],['Hindari Perilaku Seksual Berisiko','Terapkan prinsip pacaran sehat: saling menghargai, tidak melakukan kontak seksual sebelum nikah, dan berani berkata “TIDAK” pada ajakan berisiko.'],['Aktif dalam Kegiatan Positif','Bergabunglah dengan organisasi sekolah (OSIS, Pramuka, PMR) atau Kelompok Remaja BKKBN (PIK-R / Pusat Informasi dan Konseling Remaja).'],['Jalin Komunikasi Terbuka dengan Orang Tua','Jadikan orang tua sebagai sahabat berdiskusi mengenai impian, kekhawatiran, dan rencana masa depanmu.']])}
<p class="hint" id="pg">0 dari 5 langkah sudah kamu pelajari</p>`,
i:r=>accInit(r,(i,o,n)=>{$(r,'#pg').textContent=n+' dari 5 langkah sudah kamu pelajari';if(n===5&&o){confetti();toast('Perisai lengkap! Kamu siap beraksi.')}})};

P[18]={t:'Studi Kasus: <em>Kisah Rina</em> dan Cita-citanya',
b:()=>`<div class="card"><p>Rina adalah siswa kelas 11 SMA berusia 16 tahun yang berprestasi di sekolahnya dan bercita-cita menjadi seorang <b>bidan</b>. Namun, karena tekanan ekonomi keluarga dan dorongan kerabat, Rina diminta segera menikah dengan seorang pemuda di kampungnya yang baru lulus sekolah. Jika Rina menikah sekarang, ia harus berhenti sekolah dan merelakan mimpinya menjadi bidan.</p></div>
<h3 style="font-family:var(--fd);margin:2px 0 0">Pertanyaan Refleksi</h3>
${['Menurut pandanganmu, apa saja kerugian jangka panjang yang akan dialami Rina jika ia memutuskan menikah di usia 16 tahun?','Menurut teori PUP BKKBN, berapa tahun lagi usia ideal Rina seharusnya jika ingin menikah?','Langkah atau solusi apa yang bisa dilakukan Rina untuk mempertahankan cita-citanya tanpa merusak hubungannya dengan keluarga?'].map((q,i)=>`<div><label for="rf${i}" style="font-weight:800;display:block;margin-bottom:6px">${i+1}. ${q}</label><textarea id="rf${i}" placeholder="Tulis pendapatmu di sini..."></textarea>${i===1?'<button class="sbtn" id="kk" style="margin-top:8px;font-size:.88rem;padding:8px 14px">Lihat petunjuk</button><p id="kj" style="display:none;margin-top:8px;font-weight:700;color:var(--teal-d)">Usia ideal perempuan menurut BKKBN adalah 21 tahun. Rina 16 tahun, jadi 21 − 16 = 5 tahun lagi.</p>':''}</div>`).join('')}
<p class="hint">Tulisanmu tersimpan di perangkat ini saja</p>`,
i:r=>{$$(r,'textarea').forEach(t=>{try{t.value=localStorage.getItem('pup-'+t.id)||''}catch(e){}t.addEventListener('input',()=>{try{localStorage.setItem('pup-'+t.id,t.value)}catch(e){}})});$(r,'#kk').addEventListener('click',()=>{$(r,'#kj').style.display='block'})}};

P[19]={t:'Kuis Interaktif <em>PUP</em>',
b:()=>`<div id="qz"></div>`,
i:r=>{const Q=[['Berapa usia ideal menikah yang direkomendasikan BKKBN untuk perempuan?',['17 tahun','19 tahun','21 tahun','25 tahun'],2],['Berapa usia ideal menikah yang direkomendasikan BKKBN untuk laki-laki?',['19 tahun','21 tahun','23 tahun','25 tahun'],3],['UU No. 16 Tahun 2019 menetapkan batas minimal usia menikah bagi laki-laki dan perempuan adalah...',['17 tahun','19 tahun','21 tahun','25 tahun'],1],['Masa “Menata Perkawinan” dalam kerangka PUP berada pada usia...',['Kurang dari 21 tahun','21–25 tahun','Lebih dari 25 tahun','Di atas 30 tahun'],1],['Empat dimensi kesiapan berkeluarga menurut BKKBN mencakup kesiapan...',['Fisik, Mental, Ekonomi, dan Sosial','Usia, Rumah, Mobil, dan Jabatan','Fisik, Kecantikan, Kekayaan, dan Silsilah','Mental, Pendidikan, Pacar, dan Agama'],0]];let i=0,s=0;const box=$(r,'#qz');const show=()=>{if(i>=Q.length){const pct=s/Q.length;box.innerHTML=`<div class="card" style="text-align:center"><div class="big" style="font-size:3.4rem">${s}/${Q.length}</div><p style="font-weight:800;margin:6px 0">${pct===1?'Sempurna! Kamu paham PUP.':pct>=.6?'Bagus! Sedikit lagi sempurna.':'Ayo baca ulang modul dan coba lagi.'}</p><button class="sbtn" id="rt">Ulangi kuis</button></div>`;if(pct>=.8)confetti();$(r,'#rt').onclick=()=>{i=0;s=0;show()};return}const q=Q[i];box.innerHTML=`<div style="display:grid;gap:10px"><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="hint" style="animation:none">Soal ${i+1} dari ${Q.length}</p><p style="font-weight:800;font-size:1.08rem">${q[0]}</p>${q[1].map((o,k)=>`<button class="qopt" data-k="${k}"><b>${'abcd'[k]}.</b> ${o}</button>`).join('')}<p id="fb" style="font-weight:800;min-height:1.4em"></p></div>`;$$(box,'.qopt').forEach(b=>b.addEventListener('click',()=>{const k=+b.dataset.k,ok=k===q[2];if(ok)s++;$$(box,'.qopt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q[2])x.classList.add('ok')});if(!ok)b.classList.add('no');$(box,'#fb').innerHTML=ok?'<span style="color:var(--ok)">Benar!</span>':'<span style="color:var(--bad)">Belum tepat.</span> Jawaban yang benar ditandai hijau.';const nx=document.createElement('button');nx.className='sbtn';nx.textContent=i<Q.length-1?'Soal berikutnya ►':'Lihat skor';nx.onclick=()=>{i++;show()};box.firstChild.appendChild(nx)}))};show()}};

P[20]={t:'Rangkuman &amp; <em>Pesan Kunci</em> PUP',
b:()=>`<p class="lead">5 pesan kunci yang wajib kamu bawa pulang:</p>
${ACC([['Rencanakan Masa Depanmu','Pernikahan bukan balapan. Menikahlah di saat kamu sudah SIAP, bukan saat kamu merasa KESEPIAN!'],['Patuhi Usia Ideal 21 & 25','Ingat selalu angka emas BKKBN: minimal 21 tahun untuk perempuan dan 25 tahun untuk laki-laki.'],['Penuhi 4 Dimensi Kesiapan','Pastikan kamu sudah matang secara Fisik, Mental, Ekonomi, dan Sosial sebelum membina rumah tangga.'],['Katakan TIDAK pada Pernikahan Dini','Lindungi kesehatan reproduksimu, cegah stunting, dan putus lingkaran kemiskinan.'],['Raih Pendidikan Tinggi & Cita-Cita','Jadilah Generasi Emas Indonesia yang cerdas, sehat, berdaya saing, dan berencana!']])}
<button class="sbtn" id="cf" style="align-self:flex-start">🎉 Rayakan!</button>`,
i:r=>{accInit(r);$(r,'#cf').addEventListener('click',confetti);setTimeout(confetti,700)}};

P[21]={t:'Daftar Pustaka &amp; <em>Referensi Resmi</em>',
b:()=>`<div class="grid">${[['BKKBN. (2025).','Pedoman Pelaksanaan Program Pendewasaan Usia Perkawinan (PUP) dan Kesepakatan Usia Ideal Menikah. Jakarta: Badan Kependudukan dan Keluarga Berencana Nasional.'],['Hadiningrum, H. (2024).','Kesehatan Reproduksi Remaja Dan Wanita. Jakarta: Penerbit Buku Kesehatan.'],['Notoatmodjo, S. (2018).','Promosi Kesehatan Teori dan Aplikasi (Edisi Revisi). Jakarta: PT Rineka Cipta.'],['Pemerintah Republik Indonesia. (2019).','Undang-Undang Nomor 16 Tahun 2019 tentang Perubahan atas Undang-Undang Nomor 1 Tahun 1974 tentang Perkawinan. Jakarta: Sekretariat Negara.'],['World Health Organization (WHO). (2023).','Adolescent Pregnancy and Reproductive Health Guidelines. Geneva: WHO Press.']].map(x=>`<p class="ref"><b>${x[0]}</b> ${x[1]}</p>`).join('')}</div>
<button class="sbtn" data-go="1" style="align-self:flex-start">↺ Kembali ke awal</button>`};
/* ===== MESIN FLIPBOOK ===== */
const N=21,book=document.getElementById('book');let cur=0,busy=false;
const mk=(n)=>{const e=document.createElement('section');e.className='page'+(n===1?' cv':'');e.dataset.n=n;const p=P[n];e.innerHTML=`<div class="ill">${ILL[n]()}<span class="pno">${String(n).padStart(2,'0')}</span></div><div class="txt"><span class="kick">${MOD[n-1]}</span><h2>${p.t}</h2>${p.b()}</div>`;p.i&&p.i(e);return e};
const wire=r=>$$(r,'[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));
const ui=()=>{document.getElementById('pbar').style.width=(cur/N*100)+'%';document.getElementById('ind').innerHTML=`<b>${cur}</b> / ${N}<span> · ${MOD[cur-1]}</span>`;document.getElementById('prev').disabled=cur<=1;document.getElementById('next').disabled=cur>=N;try{if(location.hash!=='#hal-'+cur)history.replaceState(null,'','#hal-'+cur)}catch(e){}};
function go(n){n=Math.max(1,Math.min(N,n));if(busy||n===cur)return;speechStop();const e=mk(n);wire(e);const old=book.querySelector('.page');const fwd=n>cur;cur=n;ui();if(!old){book.appendChild(e);return}busy=true;if(fwd){e.classList.add('under');book.insertBefore(e,old);old.classList.add('out')}else{e.classList.add('in');book.appendChild(e)}setTimeout(()=>{(fwd?old:old).remove();e.classList.remove('under','in');busy=false},650)}
document.getElementById('next').onclick=()=>go(cur+1);document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('home').onclick=()=>go(3);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let sx=0,sy=0;book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});book.addEventListener('touchend',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(cur+(dx<0?1:-1))},{passive:true});
/* narasi suara */
const spk=document.getElementById('spk');function speechStop(){try{speechSynthesis.cancel()}catch(e){}spk.setAttribute('aria-pressed','false')}
spk.onclick=()=>{if(spk.getAttribute('aria-pressed')==='true'){speechStop();return}if(!('speechSynthesis' in window)){toast('Narasi suara belum didukung di perangkat ini');return}try{const t=book.querySelector('.page:last-child .txt').innerText;const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.95;u.onend=()=>spk.setAttribute('aria-pressed','false');speechSynthesis.cancel();speechSynthesis.speak(u);spk.setAttribute('aria-pressed','true')}catch(e){toast('Narasi suara tidak bisa diputar di sini')}};
const h=parseInt((location.hash.match(/hal-(\d+)/)||[])[1])||1;go(h);
</script>
